services:
  app:
    image: stream-thing-app:dev
    build:
      dockerfile: Dockerfile
      context: .
      target: dev
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - /dev/null:/app/.env:ro
      - /app/node_modules
      - /app/.next
      - /app/src/generated/prisma
    environment:
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:?error}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:?error}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET:?error}
      - DB_URL=${DB_URL:?error}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?error}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?error}
      - LIVEKIT_API_URL=${LIVEKIT_API_URL:?error}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:?error}
      - NEXT_PUBLIC_LIVEKIT_WS_URL=${NEXT_PUBLIC_LIVEKIT_WS_URL:?error}
      - UPLOADTHING_TOKEN=${UPLOADTHING_TOKEN:?error}

  db-studio:
    image: stream-thing-app:dev
    command: node scripts/prisma-studio.mjs
    ports:
      - '127.0.0.1:5555:5556'
    volumes:
      - .:/app
      - /dev/null:/app/.env:ro
      - /app/node_modules
    environment:
      - DB_URL=${DB_URL:?error}

  ngrok:
    image: ngrok/ngrok
    command: http --domain=${NGROK_DOMAIN} app:3000
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
